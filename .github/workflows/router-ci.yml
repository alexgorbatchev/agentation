name: Router CI

on:
  push:
    branches: [main]
    paths:
      - "router/**"
      - ".github/workflows/router-ci.yml"
      - ".github/workflows/router-binaries.yml"
  pull_request:
    branches: [main]
    paths:
      - "router/**"
      - ".github/workflows/router-ci.yml"
      - ".github/workflows/router-binaries.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: router/go.mod

      - name: Go test
        working-directory: router
        run: go test ./...

  cross-build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: router/go.mod

      - name: Cross-compile router
        working-directory: router
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p ../tmp/router-ci
          binary="../tmp/router-ci/agentation-router-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            binary="${binary}.exe"
          fi
          go build -trimpath -ldflags="-s -w" -o "$binary" ./cmd/agentation-router
